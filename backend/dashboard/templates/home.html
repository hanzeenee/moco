<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>

<h1>강의 목록</h1>

{% if lectures %}
    <ul>
        {% for lecture in lectures %}
            <li>
                <strong>{{ lecture.title }}</strong><br>
                <a href="{{ lecture.url }}" target="_blank">
                    {{ lecture.url }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>등록된 강의가 없습니다.</p>
{% endif %}

</body>
</html>
