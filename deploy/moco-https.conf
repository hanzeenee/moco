server {
    server_name moconix.com;

    client_max_body_size 50M;

    location = /.env { return 404; }
    location = /.env.local { return 404; }
    location = /.env.production { return 404; }
    location = /.env.backup { return 404; }
    location = /.env.bak { return 404; }
    location ^~ /.git/ { return 404; }
    location ^~ /.aws/ { return 404; }

    location ~ /\.(?!well-known) {
        return 404;
    }

    location /static/ {
        alias /home/ec2-user/moco/backend/staticfiles/;
        # Compress public text assets; API and authenticated responses are unchanged.
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /home/ec2-user/moco/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /accounts/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/moconix.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/moconix.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# Keep redirects permanent while preserving request methods and query strings.
server {
    listen 443 ssl;
    server_name www.moconix.com;

    ssl_certificate /etc/letsencrypt/live/moconix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moconix.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://moconix.com$request_uri;
}

server {
    listen 80;
    server_name moconix.com www.moconix.com;
    return 308 https://moconix.com$request_uri;
}
